name: Testing ci/cd pipeline with an docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/home/ubuntu/docker-ci-cd" ]; then
              git clone https://github.com /home/ubuntu/docker-ci-cd
            fi
            cd /home/ubuntu/docker-ci-cd
            git pull
            docker compose up -d --build
